# Supabase local development config. Hosted project: Frankfurt (eu-central-1), ADR 0010.
project_id = "healthypaws"

[api]
enabled = true
port = 54321
schemas = ["public"]            # private and analytics are NOT exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://healthypaws.io"
additional_redirect_urls = ["healthypaws://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false      # ADR 0017: no anonymous sign-in

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6                          # email code sign-in
otp_expiry = 3600

# Apple and Google native sign-in: fill client IDs in the dashboard / env, never commit secrets.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
skip_nonce_check = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
